manifest:
  # --- Agents ---

  chief:
    description: "The team mascot. Tell Chief anything (decisions, what you learned, what you had for lunch)."
    quick_prompts:
      - "What's up chief?"
      - "Hey Chief, we're getting zapatos from garaje"
      - "Chief, we're going with planetscale over RDS"

  agent-builder:
    description: "Creates agents, teams, and workflows using the AgentOS Studio."
    quick_prompts:
      - "Build an agent like chief but sassier"
      - "Build an agent that tracks AI news and writes a daily brief"
      - "Build a multi-agent team with the chief and platform manager"

  platform-manager:
    description: "Understands, monitors, and explains this AgentOS. Codebase context, runtime diagnostics, usage patterns."
    quick_prompts:
      - "Tell me about this AgentOS"
      - "Share some usage patterns"
      - "Which agent is slowest, and is anything failing?"

  ad-assessment-advisor:
    description: "Prepara cenários de avaliação AD/DNS/PKI e gera payload/scripts para runner PowerShell separado."
    quick_prompts:
      - "Quero avaliar o domínio contoso.local com PKI"
      - "Monte o payload para ad-assessment-run"
      - "Mostre os scripts do último job"

  ad-assessment-coordinator:
    description: "Primeiro contato do assessment: entrevista o usuário, monta o escopo e delega automaticamente para workflow e handoff Jira/Scrum."
    quick_prompts:
      - "Quero iniciar um assessment AD"
      - "Monte o escopo e já inicie o workflow"
      - "Prepare também a GMUD em formato Jira/Scrum"

  # --- Workflows ---

  deployment-check:
    description: "Run a deployment check to verify the AgentOS is running correctly."
    quick_prompts:
      - "Run the deployment check"

  run-evals:
    description: "Run a subset of the eval suite."
    quick_prompts:
      - "Run the smoke evals"

  ad-assessment-run:
    description: "Run the AD/DNS (optionally PKI) assessment orchestrator and return report artifact paths."
    quick_prompts:
      - "Run AD assessment for test.com"
      - '{"domain":"contoso.local","include_pki":true,"generate_mermaid":true}'
